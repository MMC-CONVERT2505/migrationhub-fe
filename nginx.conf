# First path segments the SPA routes (keep in step with src/App.tsx; a test enforces it).
map $uri $spa_route {
    default 0;
    ~^/$ 1;
    ~^/(about|how-it-works|supported-platforms|contact|privacy|termsofuse|payment|migration|migrations|sign-in|sign-up|forgot-password|reset-password|change-password|admin)(/|$) 1;
}

# noindex for every 404 and for private areas, judged on the ORIGINAL request (rewrites change $uri).
map "$status $request_uri" $x_robots {
    default "";
    "~^404 " "noindex, nofollow";
    "~^\d+ /(api|admin|payment|migration|migrations|sign-in|sign-up|forgot-password|reset-password|change-password)([/?]|$)" "noindex, nofollow";
}

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 200m;

    # Redirects stay relative: behind a proxy nginx does not know the public scheme, host or port.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/xml application/json application/javascript text/javascript image/svg+xml application/manifest+json;

    include /etc/nginx/security-headers.conf;

    # Unknown paths answer 404 (with the app shell, so the client-side 404 page renders).
    error_page 404 /index.html;

    # Proxy API calls to the backend container (same compose network).
    # Trailing slash strips the /api prefix: /api/auth/login -> /auth/login
    location /api/ {
        proxy_pass         http://mmcconvert:9001/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Hashed build files never change: cache for a year. Missing ones are a plain 404, not the app shell.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security-headers.conf;
    }

    # Self-hosted fonts: renamed if they ever change, so cache them for a year.
    location /fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security-headers.conf;
    }

    # Unhashed static files: revalidate daily.
    location ~ ^/(logos|static)/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/security-headers.conf;
    }

    # robots.txt and sitemap.xml are real files in the build (sitemap served as application/xml).
    location = /robots.txt {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }
    location = /sitemap.xml {
        try_files $uri =404;
        types { }
        default_type application/xml;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }

    # Public pages are prerendered to real HTML at build time (home.html, about.html ...; list: src/seo/pages.json).
    # The page falls back to the app shell if its file is ever missing, so a bad build cannot take a page down.
    location = / {
        try_files /home.html /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }
    location ~ ^/(?<page>how-it-works|supported-platforms|about|contact|privacy|termsofuse)$ {
        try_files /$page.html /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }
    # One URL per page: a trailing slash redirects to the canonical form.
    location ~ ^/(?<page>how-it-works|supported-platforms|about|contact|privacy|termsofuse)/$ {
        return 301 /$page;
    }

    # The prerendered files are an implementation detail: their only public URL is the canonical page.
    location ~ ^/(home|how-it-works|supported-platforms|about|contact|privacy|termsofuse)\.html$ {
        return 404;
    }
    # The app shell is reached only through the fallbacks below (and error_page), never as a public URL of its own.
    location = /index.html {
        internal;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }
    location = /site.webmanifest {
        try_files $uri =404;
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/security-headers.conf;
    }

    # SPA fallback for react-router: app routes get the shell (200); anything else a 404.
    location / {
        try_files $uri $uri/ @spa;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }
    location @spa {
        if ($spa_route = 0) { return 404; }
        rewrite ^ /index.html break;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }
}
