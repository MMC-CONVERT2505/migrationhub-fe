# First path segments the SPA routes (keep in step with src/App.tsx; a test enforces it).
map $uri $spa_route {
    default 0;
    ~^/$ 1;
    ~^/(about|contact|privacy|termsofuse|payment|migration|migrations|sign-in|sign-up|forgot-password|reset-password|change-password|admin)(/|$) 1;
}

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 200m;

    # Security headers. CSP starts report-only: watch the console/reports, then enforce.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.mmcconvert.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://accounts.google.com https://*.mmcconvert.com" always;

    # Unknown paths answer 404 (with the app shell, so the client-side 404 page renders).
    error_page 404 /index.html;

    # Proxy API calls to the backend container (same compose network).
    # Trailing slash strips the /api prefix: /api/auth/login -> /auth/login
    location /api/ {
        proxy_pass         http://mmcconvert:9001/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Missing build assets are a plain 404, not the app shell.
    location /assets/ {
        try_files $uri =404;
    }

    # robots.txt and sitemap.xml are real files in the build.
    location = /robots.txt  { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }

    # SPA fallback for react-router: app routes get the shell (200); anything else a 404.
    location / {
        try_files $uri $uri/ @spa;
    }
    location @spa {
        if ($spa_route = 0) { return 404; }
        rewrite ^ /index.html break;
    }
}
