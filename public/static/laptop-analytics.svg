<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 370" width="560" height="370" role="img" aria-labelledby="t">
  <title id="t">Laptop showing an analytics dashboard</title>
  <defs>
    <linearGradient id="screenBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef5fd"/>
      <stop offset="1" stop-color="#dce9f8"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef4444" stop-opacity=".75"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity=".15"/>
    </linearGradient>
    <filter id="card" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#1e3a8a" flood-opacity=".12"/>
    </filter>
  </defs>

  <!-- shadow -->
  <ellipse cx="280" cy="352" rx="250" ry="9" fill="#0f172a" opacity=".12"/>

  <!-- screen bezel -->
  <rect x="60" y="14" width="440" height="296" rx="16" fill="url(#bezel)"/>
  <circle cx="280" cy="23" r="2.5" fill="#64748b"/>
  <rect x="74" y="32" width="412" height="266" rx="6" fill="url(#screenBg)"/>

  <!-- header -->
  <rect x="86" y="44" width="62" height="6" rx="3" fill="#94a3b8"/>
  <rect x="154" y="44" width="34" height="6" rx="3" fill="#cbd5e1"/>
  <text x="330" y="54" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing=".6" fill="#334155">ANALYTICS</text>
  <rect x="404" y="42" width="54" height="16" rx="8" fill="#dcfce7"/>
  <text x="431" y="53.5" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" font-weight="700" fill="#16a34a">▲ 59%</text>

  <!-- card A: bar chart -->
  <g filter="url(#card)"><rect x="86" y="66" width="150" height="104" rx="6" fill="#fff"/></g>
  <rect x="96" y="76" width="48" height="5" rx="2.5" fill="#334155"/>
  <line x1="96" y1="160" x2="226" y2="160" stroke="#e2e8f0"/>
  <g>
    <rect x="98"  y="130" width="8" height="30" rx="1.5" fill="#14b8a6"/>
    <rect x="110" y="115" width="8" height="45" rx="1.5" fill="#3b82f6"/>
    <rect x="122" y="135" width="8" height="25" rx="1.5" fill="#f97316"/>
    <rect x="134" y="105" width="8" height="55" rx="1.5" fill="#14b8a6"/>
    <rect x="146" y="120" width="8" height="40" rx="1.5" fill="#3b82f6"/>
    <rect x="158" y="98"  width="8" height="62" rx="1.5" fill="#f97316"/>
    <rect x="170" y="125" width="8" height="35" rx="1.5" fill="#14b8a6"/>
    <rect x="182" y="110" width="8" height="50" rx="1.5" fill="#3b82f6"/>
    <rect x="194" y="102" width="8" height="58" rx="1.5" fill="#f97316"/>
    <rect x="206" y="132" width="8" height="28" rx="1.5" fill="#14b8a6"/>
    <rect x="218" y="94"  width="8" height="66" rx="1.5" fill="#3b82f6"/>
  </g>

  <!-- card B: area + line chart with legend -->
  <g filter="url(#card)"><rect x="246" y="66" width="228" height="104" rx="6" fill="#fff"/></g>
  <line x1="258" y1="160" x2="408" y2="160" stroke="#e2e8f0"/>
  <line x1="258" y1="130" x2="408" y2="130" stroke="#f1f5f9"/>
  <line x1="258" y1="100" x2="408" y2="100" stroke="#f1f5f9"/>
  <path d="M258 150 L278 140 L298 146 L318 124 L338 132 L358 110 L378 118 L398 92 L408 96 L408 160 L258 160 Z" fill="url(#area)"/>
  <polyline points="258,138 278,128 298,134 318,108 338,118 358,96 378,104 398,80 408,84" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <g>
    <circle cx="422" cy="90"  r="3" fill="#ef4444"/><rect x="430" y="88"  width="34" height="4" rx="2" fill="#cbd5e1"/>
    <circle cx="422" cy="106" r="3" fill="#334155"/><rect x="430" y="104" width="28" height="4" rx="2" fill="#cbd5e1"/>
    <circle cx="422" cy="122" r="3" fill="#3b82f6"/><rect x="430" y="120" width="32" height="4" rx="2" fill="#cbd5e1"/>
    <circle cx="422" cy="138" r="3" fill="#14b8a6"/><rect x="430" y="136" width="24" height="4" rx="2" fill="#cbd5e1"/>
  </g>

  <!-- card C: grouped bars + trend line -->
  <g filter="url(#card)"><rect x="86" y="180" width="228" height="108" rx="6" fill="#fff"/></g>
  <rect x="96" y="190" width="56" height="5" rx="2.5" fill="#334155"/>
  <line x1="96" y1="278" x2="304" y2="278" stroke="#e2e8f0"/>
  <g>
    <rect x="100" y="252" width="7" height="26" rx="1.5" fill="#14b8a6"/><rect x="108" y="244" width="7" height="34" rx="1.5" fill="#3b82f6"/>
    <rect x="124" y="246" width="7" height="32" rx="1.5" fill="#14b8a6"/><rect x="132" y="236" width="7" height="42" rx="1.5" fill="#3b82f6"/>
    <rect x="148" y="256" width="7" height="22" rx="1.5" fill="#14b8a6"/><rect x="156" y="240" width="7" height="38" rx="1.5" fill="#3b82f6"/>
    <rect x="172" y="238" width="7" height="40" rx="1.5" fill="#14b8a6"/><rect x="180" y="228" width="7" height="50" rx="1.5" fill="#3b82f6"/>
    <rect x="196" y="248" width="7" height="30" rx="1.5" fill="#14b8a6"/><rect x="204" y="232" width="7" height="46" rx="1.5" fill="#3b82f6"/>
    <rect x="220" y="232" width="7" height="46" rx="1.5" fill="#14b8a6"/><rect x="228" y="220" width="7" height="58" rx="1.5" fill="#3b82f6"/>
    <rect x="244" y="242" width="7" height="36" rx="1.5" fill="#14b8a6"/><rect x="252" y="226" width="7" height="52" rx="1.5" fill="#3b82f6"/>
    <rect x="268" y="226" width="7" height="52" rx="1.5" fill="#14b8a6"/><rect x="276" y="212" width="7" height="66" rx="1.5" fill="#3b82f6"/>
  </g>
  <polyline points="104,236 128,226 152,232 176,216 200,222 224,206 248,212 272,200 296,204" fill="none" stroke="#f97316" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <g fill="#fff" stroke="#f97316" stroke-width="1.5">
    <circle cx="128" cy="226" r="2.5"/><circle cx="176" cy="216" r="2.5"/><circle cx="224" cy="206" r="2.5"/><circle cx="272" cy="200" r="2.5"/>
  </g>

  <!-- card D: donut + list -->
  <g filter="url(#card)"><rect x="324" y="180" width="150" height="108" rx="6" fill="#fff"/></g>
  <g transform="rotate(-90 364 234)" fill="none" stroke-width="13">
    <circle cx="364" cy="234" r="26" stroke="#e2e8f0"/>
    <circle cx="364" cy="234" r="26" stroke="#3b82f6" stroke-dasharray="62 101.4"/>
    <circle cx="364" cy="234" r="26" stroke="#14b8a6" stroke-dasharray="44 119.4" stroke-dashoffset="-63"/>
    <circle cx="364" cy="234" r="26" stroke="#f97316" stroke-dasharray="30 133.4" stroke-dashoffset="-108"/>
  </g>
  <g>
    <rect x="404" y="210" width="58" height="5" rx="2.5" fill="#334155"/>
    <rect x="404" y="222" width="50" height="4" rx="2" fill="#cbd5e1"/>
    <rect x="404" y="232" width="56" height="4" rx="2" fill="#cbd5e1"/>
    <rect x="404" y="242" width="44" height="4" rx="2" fill="#cbd5e1"/>
    <rect x="404" y="252" width="52" height="4" rx="2" fill="#cbd5e1"/>
  </g>

  <!-- base -->
  <rect x="40" y="306" width="480" height="12" rx="4" fill="#cbd5e1"/>
  <path d="M18 316 H542 L530 338 Q527 344 519 344 H41 Q33 344 30 338 Z" fill="url(#base)"/>
  <path d="M238 316 H322 Q322 324 314 324 H246 Q238 324 238 316 Z" fill="#94a3b8"/>
</svg>
