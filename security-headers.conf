# Included by nginx.conf at server level and in every location that sets its own add_header
# (nginx drops inherited headers in such locations). One place, so no location can miss one.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# CSP starts report-only: watch the console/reports, then enforce.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.mmcconvert.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://accounts.google.com https://*.mmcconvert.com" always;
# Private areas and every 404 stay out of search results (empty value = header not sent).
add_header X-Robots-Tag $x_robots always;
